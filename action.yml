name: 'craneship'
description: 'Build, tag and push docker images, with the tags derived from the git ref.'

inputs:
    dockerFileName:
        description: 'Name of Dockerfile'
        required: false
        default: 'Dockerfile'
    dockerFilePath:
        description: 'Relative path to DockerFile'
        required: false
        default: ''
    buildArgs:
        description: 'Provide additional build args (KEY=VALUE), one per line'
        required: false
        default: ''
    cleanup:
        description: 'Delete the built image at the end'
        required: false
        default: 'true'
    clone:
        description: 'Clone the repository at the ref instead of building the checked out workspace. Only needed when the workflow does not run actions/checkout.'
        required: false
        default: 'false'
    platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64), comma or newline separated. When set, the image is built with docker buildx and pushed straight from the build; QEMU is set up for foreign platforms.'
        required: false
        default: ''
    gitTag:
        description: 'Whether to create an image tag for a git tag.'
        required: false
        default: 'true'
    gitTagPrefix:
        description: 'Prefix for matching git tags'
        required: false
        default: ''
    gitUser:
        description: 'Git user'
        required: false
        default: ${{ github.actor }}
    gitPassword:
        description: 'Git password'
        required: false
        default: ${{ github.token }}
    registryHost:
        description: 'Registry host'
        required: false
        default: 'ghcr.io'
    registryUser:
        description: 'Registry user'
        required: false
        default: ${{ github.actor }}
    registryPassword:
        description: 'Registry password'
        required: false
        default: ${{ github.token }}
    registryRepository:
        description: 'Registry repository full name (e.g. project/repository)'
        required: false
        default: ${{ github.repository }}
    registryTag:
        description: 'Registry image tags (e.g. latest), one per line'
        required: false
        default: ''
    token:
        description: 'Deprecated and unused. Declared so existing workflows do not warn.'
        required: false
        default: ''
    node-version:
        description: 'Node.js version to use. Set to an empty string to use the existing installation.'
        required: false
        default: '24'

branding:
    icon: 'package'
    color: 'blue'

runs:
    using: 'composite'
    steps:
        -   name: Setup Node.js
            if: inputs.node-version != ''
            uses: actions/setup-node@v4
            with:
                node-version: ${{ inputs.node-version }}

        -   name: Install dependencies
            shell: bash
            run: npm ci --ignore-scripts
            working-directory: ${{ github.action_path }}

        -   name: Build
            shell: bash
            run: npm run build
            working-directory: ${{ github.action_path }}

        # A foreign platform's RUN steps execute under QEMU emulation, which
        # needs binfmt handlers registered on the runner. Only the requested
        # platforms are installed (setup-qemu-action splits on commas and
        # newlines, binfmt maps linux/arm64 to arm64).
        -   name: Set up QEMU
            if: inputs.platforms != ''
            uses: docker/setup-qemu-action@v4
            with:
                platforms: ${{ inputs.platforms }}

        -   name: Publish
            shell: bash
            # Inputs travel through the environment instead of being interpolated
            # into the script, so newlines and shell metacharacters stay inert.
            env:
                INPUT_DOCKER_FILE_NAME: ${{ inputs.dockerFileName }}
                INPUT_DOCKER_FILE_PATH: ${{ inputs.dockerFilePath }}
                INPUT_BUILD_ARGS: ${{ inputs.buildArgs }}
                INPUT_CLEANUP: ${{ inputs.cleanup }}
                INPUT_CLONE: ${{ inputs.clone }}
                INPUT_PLATFORMS: ${{ inputs.platforms }}
                INPUT_GIT_TAG: ${{ inputs.gitTag }}
                INPUT_GIT_TAG_PREFIX: ${{ inputs.gitTagPrefix }}
                INPUT_GIT_USER: ${{ inputs.gitUser }}
                INPUT_GIT_PASSWORD: ${{ inputs.gitPassword }}
                INPUT_REGISTRY_HOST: ${{ inputs.registryHost }}
                INPUT_REGISTRY_USER: ${{ inputs.registryUser }}
                INPUT_REGISTRY_PASSWORD: ${{ inputs.registryPassword }}
                INPUT_REGISTRY_REPOSITORY: ${{ inputs.registryRepository }}
                INPUT_REGISTRY_TAG: ${{ inputs.registryTag }}
                ACTION_PATH: ${{ github.action_path }}
            run: |
                set -euo pipefail

                args=(
                    --dockerFileName "$INPUT_DOCKER_FILE_NAME"
                    --dockerFilePath "$INPUT_DOCKER_FILE_PATH"
                    --buildArgs "$INPUT_BUILD_ARGS"
                    --platforms "$INPUT_PLATFORMS"
                    --gitTagPrefix "$INPUT_GIT_TAG_PREFIX"
                    --gitUser "$INPUT_GIT_USER"
                    --gitPassword "$INPUT_GIT_PASSWORD"
                    --registryHost "$INPUT_REGISTRY_HOST"
                    --registryUser "$INPUT_REGISTRY_USER"
                    --registryPassword "$INPUT_REGISTRY_PASSWORD"
                    --registryRepository "$INPUT_REGISTRY_REPOSITORY"
                    --registryTag "$INPUT_REGISTRY_TAG"
                )

                if [ "$INPUT_CLEANUP" = "false" ]; then args+=(--no-cleanup); fi
                if [ "$INPUT_GIT_TAG" = "false" ]; then args+=(--no-gitTag); fi
                if [ "$INPUT_CLONE" = "true" ]; then args+=(--clone); fi

                node "${ACTION_PATH}/dist/cli.mjs" "${args[@]}"
