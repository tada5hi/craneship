name: CI

on:
    push:
        branches: [develop, master, next, beta, alpha]
    pull_request:
        branches: [develop, master, next, beta, alpha]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    PRIMARY_NODE_VERSION: 24

jobs:
    install:
        name: Checkout and Install
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

    build:
        name: Build
        needs: [install]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}
            -   name: Build
                uses: ./.github/actions/build

    lint:
        name: Lint
        needs: [build]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

            -   name: Build
                uses: ./.github/actions/build

            -   name: Lint
                run: |
                    npm run lint

    tests:
        name: Test
        needs: [build]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

            -   name: Build
                uses: ./.github/actions/build

            -   name: Run tests
                run: |
                    npm run test:coverage

    action-runtime:
        name: Action runtime (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: ['22']
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    check-latest: true
            -   run: npm ci --ignore-scripts
            -   run: npm run build
            -   uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node }}
                    check-latest: true
            -   run: node dist/cli.mjs --help

    action-runtime-failure:
        name: Restore action runtime after build failure
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    check-latest: true
            -   name: Capture caller runtime and force a build failure
                run: |
                    echo "EXPECTED_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
                    node <<'NODE'
                    const fs = require('node:fs');
                    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    pkg.scripts.build = "node -e \"require('node:fs').writeFileSync('.expected-build-failure', 'yes'); process.exit(23)\"";
                    fs.writeFileSync('package.json', JSON.stringify(pkg));
                    NODE
            -   name: Run the real composite action
                id: action
                continue-on-error: true
                uses: ./
                with:
                    node-version: ''
            -   name: Assert failure and restored caller runtime
                env:
                    ACTION_OUTCOME: ${{ steps.action.outcome }}
                run: |
                    test -f .expected-build-failure
                    test "$ACTION_OUTCOME" = failure
                    test "$(node -p 'process.execPath')" = "$EXPECTED_NODE"
